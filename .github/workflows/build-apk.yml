name: Build Android APK

# Cloud build for the Kivy pi calculator.
# Runs in GitHub-hosted Ubuntu, so no local Android SDK/NDK download
# and no Docker Desktop required.
#
# Trigger manually: Actions tab -> "Build Android APK" -> Run workflow.
# The finished APK is attached to the run as a build artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Core packages - these exist on every recent Ubuntu image.
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev
          # ncurses / tinfo package names differ by Ubuntu release:
          # libtinfo5 exists on 22.04 but was REMOVED on 24.04 (noble),
          # where only libtinfo6 ships. apt-get aborts the whole command
          # if a single name is missing, so try old names, then new ones,
          # and never let this step fail the build.
          sudo apt-get install -y libncurses5-dev libncursesw5-dev libtinfo5 \
            || sudo apt-get install -y libncurses-dev libtinfo6 \
            || echo "ncurses/tinfo unavailable - continuing anyway"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build APK
        working-directory: android
        run: buildozer -v android debug

      - name: Locate APK
        id: locate
        working-directory: android
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pi-calculator-apk
          path: android/bin/*.apk
          if-no-files-found: warn
