name: Build Android APK

# Cloud build for the Kivy pi calculator.
# Runs in GitHub-hosted Ubuntu, so no local Android SDK/NDK download
# and no Docker Desktop required.
#
# Trigger manually: Actions tab -> "Build Android APK" -> Run workflow.
# The finished APK is attached to the run as a build artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    # Pinned on purpose - do not change to ubuntu-latest.
    #
    # Ubuntu 24.04 ships libtool 2.4.7, which no longer provides the
    # LT_SYS_SYMBOL_USCORE macro. python-for-android builds libffi 3.4.2,
    # whose configure.ac still uses it, so autoreconf dies with
    # "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
    # Ubuntu 22.04 has libtool 2.4.6 and builds libffi fine.
    #
    # Pinning also protects us from the ubuntu-latest -> Ubuntu 26.04
    # migration, which would otherwise change the OS under our feet.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Core packages - these exist on every recent Ubuntu image.
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev \
            automake libtool-bin libltdl-dev gperf
          # ncurses / tinfo package names differ by Ubuntu release:
          # libtinfo5 exists on 22.04 but was REMOVED on 24.04 (noble),
          # where only libtinfo6 ships. apt-get aborts the whole command
          # if a single name is missing, so try old names, then new ones,
          # and never let this step fail the build.
          sudo apt-get install -y libncurses5-dev libncursesw5-dev libtinfo5 \
            || sudo apt-get install -y libncurses-dev libtinfo6 \
            || echo "ncurses/tinfo unavailable - continuing anyway"

      - name: Select Java 17 for Gradle
        # The Android Gradle Plugin refuses to run on Java 11:
        #   "Android Gradle plugin requires Java 17 to run.
        #    You are currently using Java 11."
        # Ubuntu images ship several JDKs and JAVA_HOME defaults to 11,
        # so point it at 17 explicitly (and put it first on PATH).
        run: |
          JDK17=""
          for d in "$JAVA_HOME_17_X64" \
                   /usr/lib/jvm/temurin-17-jdk-amd64 \
                   /usr/lib/jvm/java-17-openjdk-amd64; do
            if [ -n "$d" ] && [ -x "$d/bin/java" ]; then JDK17="$d"; break; fi
          done
          if [ -z "$JDK17" ]; then
            echo "::error::Java 17 not found. Available JVMs:"; ls /usr/lib/jvm; exit 1
          fi
          echo "JAVA_HOME=$JDK17" >> "$GITHUB_ENV"
          echo "PATH=$JDK17/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "JAVA_HOME = $JAVA_HOME"
          java -version 2>&1 | head -n 1
          javac -version 2>&1 | head -n 1

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build APK
        working-directory: android
        run: buildozer -v android debug

      - name: Locate APK
        id: locate
        working-directory: android
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pi-calculator-apk
          path: android/bin/*.apk
          if-no-files-found: warn
